<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9-Cat 選秀作戰室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: draft-room console. Status bar on top, recommendation + input on the left, board below, your roster on the right. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --line:#d9dee5; --fg:#16202b; --muted:#5b6774;
  --accent:#1f5fbf; --accent-soft:#e3ecfa; --mine:#b8650a; --mine-soft:#fbefe0;
  --good:#1c7a4a; --good-soft:#e2f3ea; --warn:#a6600a; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#161d25; --line:#2a3440; --fg:#e4e9ef; --muted:#93a0ae;
  --accent:#6b9eea; --accent-soft:#1c2a3e; --mine:#e9a04a; --mine-soft:#33260f;
  --good:#5cc48c; --good-soft:#163024; --warn:#e6a54b; --warn-soft:#33270f; --bad:#ef7a72; --bad-soft:#3a1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --line:#2a3440; --fg:#e4e9ef; --muted:#93a0ae;
  --accent:#6b9eea; --accent-soft:#1c2a3e; --mine:#e9a04a; --mine-soft:#33260f;
  --good:#5cc48c; --good-soft:#163024; --warn:#e6a54b; --warn-soft:#33270f; --bad:#ef7a72; --bad-soft:#3a1b19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1}
h2{font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
button.mine{background:var(--mine);border-color:var(--mine);color:var(--panel);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
/* status bar */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.status .clock{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500}
.chip.turn{background:var(--mine-soft);border-color:var(--mine);color:var(--mine);font-weight:600}
.chip.soon{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.status .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:grid;gap:14px;min-width:0}
/* entry */
.entry{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.entry input{flex:1 1 220px;min-width:0;font-size:16px}
.sugg{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:5;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sugg div{padding:8px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.sugg div.on,.sugg div:hover{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
.sugg div.gone{color:var(--muted);cursor:default;text-decoration:line-through}
.sugg div.gone:hover{background:none}
.sugg div.gone small{text-decoration:none}
.hint{color:var(--muted);font-size:12.5px}
.paste textarea{width:100%;min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* recommendations */
.rec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rec-head .big{font-family:var(--display);font-size:22px;font-weight:700}
.recs{display:grid;gap:6px}
.rec{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.rec.first{border-color:var(--mine);background:var(--mine-soft)}
.rec .idx{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.rec.first .idx{color:var(--mine)}
.rec .nm{font-weight:600}
.rec .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.go{background:var(--bad-soft);color:var(--bad)}
.tag.half{background:var(--warn-soft);color:var(--warn)}
.tag.wait{background:var(--good-soft);color:var(--good)}
.tag.risk{background:var(--warn-soft);color:var(--warn)}
.tag.fit{background:var(--accent-soft);color:var(--accent)}
.pair{border:1px dashed var(--mine);border-radius:8px;padding:10px;background:var(--mine-soft)}
.pair b{color:var(--mine)}
/* board */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{flex:1 1 160px;min-width:0}
.tablewrap{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-weight:600;color:var(--muted);font-size:12px;cursor:pointer;z-index:1}
td.r,th.r{text-align:right}
tr:hover td{background:var(--accent-soft)}
td .z{display:inline-block;min-width:34px;text-align:right;border-radius:3px;padding:0 3px}
.zp2{background:var(--good-soft);color:var(--good);font-weight:600}.zp1{color:var(--good)}
.zn1{color:var(--bad)}.zn2{background:var(--bad-soft);color:var(--bad);font-weight:600}
td button{padding:2px 8px;font-size:12px}
/* roster */
.slots{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;align-items:center}
.slots .s{font-family:var(--mono);font-size:12px;color:var(--muted)}
.slots .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots .empty{color:var(--muted);font-style:italic}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px}
.bar .track{height:8px;background:var(--bg);border-radius:4px;position:relative;overflow:hidden}
.bar .track i{position:absolute;top:0;bottom:0;border-radius:4px}
.bar .track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.punts{display:flex;flex-wrap:wrap;gap:6px}
.punts label{display:inline-flex;gap:4px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
.punts input{margin:0}
.log{display:grid;gap:2px;max-height:300px;overflow-y:auto;font-size:13px}
.log div{display:grid;grid-template-columns:42px 52px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 4px;border-radius:4px}
.log div.editing{outline:2px solid var(--accent)}
.log .acts{display:flex;gap:4px}
.log .acts button{padding:1px 7px;font-size:11.5px}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-radius:8px;padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.log div.me{background:var(--mine-soft);color:var(--mine);font-weight:600}
.log .t{color:var(--muted)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.settings label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.notice{border-radius:8px;padding:8px 12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.ok{background:var(--good-soft);color:var(--good)}
@media (prefers-reduced-motion:no-preference){.rec,.chip{transition:background .2s,border-color .2s}}
</style>

<div class="wrap">
  <div class="status">
    <h1>9-Cat 選秀作戰室</h1>
    <div class="clock" id="clock"></div>
    <div class="tools">
      <button id="undo" type="button">復原上一手</button>
      <button id="toggleSettings" type="button">聯盟設定</button>
    </div>

  <div class="panel" id="settingsPanel" hidden>

  </div>

  <div class="grid">
    <div class="col">
      <div class="panel">
        <div class="entry">
          <input id="q" type="search" placeholder="輸入被選走的球員（例如 Jokic、SGA、Wemby），按 Enter" autocomplete="off" aria-label="輸入被選走的球員">
          <button id="addBtn" class="primary" type="button">記為被選走</button>
          <div class="sugg" id="sugg" hidden></div>
        </div>
        <div class="editbar" id="editBar" hidden><span id="editMsg"></span><button id="editCancel" type="button">取消修改</button></div>
        <div class="row">
          <span class="hint" id="whoHint"></span>
          <button id="togglePaste" type="button">一次貼上多人</button>
        </div>
        <div class="paste" id="pastePanel" hidden>
          <textarea id="pasteBox" placeholder="把選秀頁面的已選名單整段貼上，或用逗號、換行分隔姓名。會依出現順序記錄。"></textarea>
          <div class="row"><button id="pasteGo" class="primary" type="button">依序記錄</button><span class="hint" id="pasteMsg"></span></div>
        </div>
      </div>

      <div class="panel" id="recPanel"></div>

      <div class="panel">
        <div class="rec-head"><h2>可選球員</h2><span class="hint" id="boardHint"></span></div>
        <div class="filters">
          <input id="filterQ" type="search" placeholder="篩選姓名 / 球隊" aria-label="篩選">
          <select id="filterPos" aria-label="位置"><option value="">全部位置</option><option>PG</option><option>SG</option><option>SF</option><option>PF</option><option>C</option></select>
        </div>
        <div class="tablewrap"><table id="board"><thead></thead><tbody></tbody></table></div>
      </div>
    </div>

    <div class="col">
      <div class="panel"><h2>你的陣容</h2><div class="slots" id="slots"></div></div>
      <div class="panel"><h2>類別強弱</h2><div class="bars" id="bars"></div>
        <div class="hint">勾選要 punt 的類別，推薦會重算。Each Category 計分建議最多 punt 1 類。</div>
        <div class="punts" id="punts"></div></div>
      <div class="panel"><h2>選秀紀錄</h2><div class="log" id="log"></div><div class="hint">「改」只換球員，順位不變。「刪」會移除那一手，之後的每一手往前移一格，所屬隊伍也跟著變，適合刪掉重複輸入的紀錄。</div></div>
    </div>
  </div>
</div>

function matchCount(list){
  const assign=new Array(SLOTS.length).fill(-1);
  const ok=(p,s)=>!SLOTS[s][1]||p.p.some(x=>SLOTS[s][1].includes(x));
  function tryP(i,seen){for(let s=0;s<SLOTS.length;s++){if(!ok(list[i],s)||seen[s])continue;seen[s]=true;if(assign[s]<0||tryP(assign[s],seen)){assign[s]=i;return true;}}return false;}
  let n=0;for(let i=0;i<list.length;i++)if(tryP(i,[]))n++;
  return {n,assign};
}

// ---------- scoring ----------
function weights(roster){
  const n=roster.length,w=[];
  CATS.forEach((c,k)=>{
    if(state.punt.includes(k)){w.push(0);return;}
    let need=0;if(n>=2){const prof=roster.reduce((s,p)=>s+p.z[k]*p.av,0)/n;need=Math.max(-.2,Math.min(.35,-prof*.3));}
    w.push(1+need);
  });
  return w;
}
const base=(p,w)=>p.z.reduce((s,z,k)=>s+w[k]*z,0)*p.av;
const ftHole=p=>p.z[7]<-1.4;

// picks I own starting now (back-to-back block) and the horizon after it
function horizon(){
  const c=cur(),mp=myPicks();
  if(c>total())return {onMe:false,block:[],next:null,k:0};
  const onMe=teamAt(c)===state.slot;
  let block=[];
  if(onMe){let p=c;while(p<=total()&&teamAt(p)===state.slot){block.push(p);p++;}}
  else{const n=mp.find(p=>p>c);if(n){let p=n;while(p<=total()&&teamAt(p)===state.slot){block.push(p);p++;}}}
  const end=block.length?block[block.length-1]:c;
  const next=mp.find(p=>p>end)||null;
  const startOthers=onMe?end+1:c;            // first pick by others we are measuring
  const k=next?Math.max(0,next-startOthers-(onMe?0:block.length)):0;
  return {onMe,block,next,k,toBlock:onMe?0:(block[0]-c)};
}
const Phi=x=>{const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),pr=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-pr:pr;};
function survival(avail,k){
  const m=new Map();[...avail].sort((a,b)=>a.a-b.a).forEach((p,i)=>{const r=i+1,sd=Math.max(2.5,r*.22);m.set(p.id,1-Phi((k+.5-r)/sd));});
  return m;
}

function expNext(cand,skip,h){
  if(!h.next)return 0;
  let e=0,left=1;
  for(const x of cand){if(skip.has(x.p.id))continue;e+=left*x.sv*x.adj;left*=1-x.sv;if(left<.01)break;}
  return e;
}
function scoreAll(){
  const roster=mine(),avail=available(),w=weights(roster),h=horizon();
  const myN=roster.length+1;                        // which of my picks this is
  const riskN=roster.filter(p=>p.k).length;
  const baseMatch=matchCount(roster).n;
  const hasC=roster.some(p=>p.p.includes('C'));
  const hasHole=roster.some(ftHole)&&!state.punt.includes(7);
  // others' picks before my block, used to estimate who reaches my current block
  const reach=h.onMe?null:survival(avail,h.toBlock||0);
  const surv=survival(avail,h.k);
  // which single-position starter slots are still empty, and how many good players are left at each position
  const {assign}=matchCount(roster);
  const emptyPos=new Set(SLOTS.map((s,i)=>assign[i]<0&&s[1]&&s[1].length===1?s[1][0]:null).filter(Boolean));
  const topLeft={};[...avail].sort((a,b)=>base(b,w)-base(a,w)).slice(0,40).forEach(p=>p.p.forEach(x=>topLeft[x]=(topLeft[x]||0)+1));
  const out=avail.map(p=>{
    const b=base(p,w),why=[];let s=b;
    const sv=h.next?surv.get(p.id):0;
    if(p.k){ if(riskN>=2){s-=1;why.push(['risk','已有 2 個風險球員']);} else if(myN<=2&&riskN>=1){s-=.6;why.push(['risk','前兩手已有風險球員']);} }
    if(myN>=5){
      const m=matchCount([...roster,p]).n;
      if(m>baseMatch){s+=myN>=9?.6:.25;why.push(['fit','補先發位置']);}
      else{
        // goes to the bench: worse the more teammates already share his positions
        const dup=roster.filter(q=>q.p.some(x=>p.p.includes(x))).length;
        const pen=Math.min(1,.2+.15*Math.max(0,dup-2));
        s-=pen;why.push(['risk',`只能進板凳（同位置已有 ${dup} 人）`]);
      }
      const scarce=p.p.filter(x=>x!=='C'&&emptyPos.has(x)&&(topLeft[x]||0)<=4);
      if(scarce.length){s+=.3;why.push(['fit',`${scarce.join('/')} 好球員快沒了`]);}
    }
    if(myN>=5&&!hasC&&p.p.includes('C')){s+=.5;why.push(['fit','還沒有 C']);}
    if(hasHole&&ftHole(p)){s-=.4;why.push(['risk','第 2 個 FT% 黑洞']);}
    return {p,b,adj:s,s,sv,reach:reach?reach.get(p.id):1,why};
  });
  // value now + expected best player still there at your next pick
  const cand=[...out].sort((a,b)=>b.adj-a.adj).slice(0,30);
  const eAll=expNext(cand,new Set(),h);
  out.forEach(x=>{x.s=x.adj+(cand.includes(x)?expNext(cand,new Set([x.p.id]),h):eAll)-eAll;});
  out.sort((a,b)=>b.s-a.s);
  return {list:out,w,h,roster,myN};
}

// ---------- render ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(x,d=1)=>(x>=0?'+':'')+x.toFixed(d);
const zc=z=>z>=1?'zp2':z>=.35?'zp1':z<=-1?'zn2':z<=-.35?'zn1':'';
const pct=x=>Math.round(x*100)+'%';
function survTag(sv,h){
  if(!h.next)return '';
  if(sv<.35)return `<span class="tag go">撐不到第 ${h.next} 手</span>`;
  if(sv<.7)return `<span class="tag half">${pct(sv)} 撐到第 ${h.next} 手</span>`;
  return `<span class="tag wait">可以等到第 ${h.next} 手</span>`;
}
function strengths(p){return p.z.map((z,k)=>[z,k]).filter(([z,k])=>!state.punt.includes(k)).sort((a,b)=>b[0]-a[0]).slice(0,3).map(([z,k])=>CATS[k]).join(' ');}

let sortKey='s',sortDir=-1;
function render(){
  const {list,w,h,roster,myN}=scoreAll();
  const c=cur(),done=c>total();
  // clock
  const r=Math.min(state.rounds,Math.ceil(c/state.teams));
  let chips=`<span class="chip">第 <b>${done?total():c}</b> 手 · 第 <b>${r}</b> 輪</span>`;
  if(done) chips+=`<span class="chip">選秀結束</span>`;
  else if(h.onMe) chips+=`<span class="chip turn">輪到你${h.block.length>1?`（連選 ${h.block.length} 手）`:''}</span>`;
  else chips+=`<span class="chip">輪到第 <b>${teamAt(c)}</b> 隊</span><span class="chip ${h.toBlock<=3?'soon':''}">再 <b>${h.toBlock}</b> 手輪到你（第 ${h.block.join('、')} 手）</span>`;
  $('clock').innerHTML=chips;
  $('whoHint').textContent=done?'':`這一手會記在${teamAt(c)===state.slot?'你':'第 '+teamAt(c)+' 隊'}名下。`;
  $('addBtn').className=editIdx==null&&teamAt(c)===state.slot?'mine':'primary';
  $('addBtn').textContent=editIdx!=null?`改成這位球員`:teamAt(c)===state.slot?'記為我選的':'記為被選走';

  renderRec(list,h,roster,myN,done,w);
  renderBoard(list,h);
  renderSide(roster,w);
  renderLog();
  save();
}

function recRow(x,i,h){
  const p=x.p;
  const tags=[survTag(x.sv,h)];
  if(!h.onMe&&x.reach<.5)tags.push(`<span class="tag">${x.reach<.05?'輪到你前多半已被選走':pct(x.reach)+' 機率輪得到你'}</span>`);
  x.why.forEach(([k,t])=>tags.push(`<span class="tag ${k}">${esc(t)}</span>`));
  if(p.r)tags.push(`<span class="tag ${p.k?'risk':''}">${esc(p.r)}</span>`);
  return `<div class="rec ${i===0?'first':''}"><div class="idx">${i+1}</div>
    <div style="min-width:0"><div class="nm">${esc(p.n)} <span class="hint">${p.p.join('/')} · ${p.t} · ADP ${p.a}</span></div>
    <div class="meta"><span class="tag">強項 ${strengths(p)}</span>${tags.join('')}</div></div>
    <button type="button" class="${h.onMe&&i===0?'mine':''}" data-pick="${p.id}">${teamAt(cur())===state.slot?'選他':'被選走'}</button></div>`;
}
function bestPair(list,roster,h){
  const top=list.slice(0,8);let best=null;
  for(let i=0;i<top.length;i++)for(let j=i+1;j<top.length;j++){
    const a=top[i],b=top[j];
    const w2=weights([...roster,a.p]),w3=weights([...roster,b.p]);
    const pen=x=>x.adj-x.b;                 // fit and risk adjustments
    const s1=a.adj+base(b.p,w2)+pen(b), s2=b.adj+base(a.p,w3)+pen(a);
    const cand=[...list].sort((x,y)=>y.adj-x.adj).slice(0,30);
    let s=Math.max(s1,s2)+expNext(cand,new Set([a.p.id,b.p.id]),h);
    if(a.p.k&&b.p.k)s-=.8;
    if(ftHole(a.p)&&ftHole(b.p)&&!state.punt.includes(7))s-=.6;
    if(!best||s>best.s)best={a,b,s};
  }
  return best;
}
function renderRec(list,h,roster,myN,done,w){
  const el=$('recPanel');
  if(done){el.innerHTML='<h2>選秀結束</h2><div>祝你這季拿冠軍。</div>';return;}
  const title=h.onMe?'現在選':`目前最佳人選（輪到你：第 ${h.block.join('、')} 手）`;
  let html=`<div class="rec-head"><span class="big">${title}</span><span class="hint">你的第 ${myN} 手${h.next?` · 下一次是第 ${h.next} 手，中間隔 ${h.k} 手`:''}</span></div>`;
  const pool=list;
  const must=pool.slice(0,6);
  if(h.block.length>=2&&roster.length+2<=state.rounds){
    const bp=bestPair(pool,roster,h);
    if(bp)html+=`<div class="pair">這兩手選：<b>${esc(bp.a.p.n)}</b> + <b>${esc(bp.b.p.n)}</b> <span class="hint">（考慮類別互補、風險，以及第 ${h.next||'-'} 手預期還拿得到誰）</span></div>`;
  }
  html+=`<div class="recs">${must.map((x,i)=>recRow(x,i,h)).join('')}</div>`;
  const waiters=pool.filter(x=>h.next&&x.sv>=.7).slice(0,3);
  if(waiters.length&&h.next)html+=`<div class="hint">第 ${h.next} 手可能還在：${waiters.map(x=>esc(x.p.n)).join('、')}</div>`;
  const notes=[];
  if(myN>=5&&!roster.some(p=>p.p.includes('C')))notes.push('你還沒有能打 C 的球員，C 很稀缺。');
  if(roster.filter(p=>p.k).length>=2)notes.push('已有 2 個傷病或出賽數風險球員，之後盡量避開。');
  if(myN>=8&&matchCount(roster).n<Math.min(10,roster.length))notes.push('有球員排不進先發位置，優先補缺的位置。');
  if(notes.length)html+=notes.map(n=>`<div class="notice">${n}</div>`).join('');
  el.innerHTML=html;
}

function renderBoard(list,h){
  const fq=norm($('filterQ').value),fp=$('filterPos').value;
  let rows=list.filter(x=>(!fq||x.p.key.includes(fq)||x.p.t.toLowerCase().includes(fq))&&(!fp||x.p.p.includes(fp)));
  const val={s:x=>x.s,b:x=>x.b,a:x=>-x.p.a,sv:x=>x.sv,n:x=>x.p.n};
  rows.sort((a,b)=>{const va=val[sortKey](a),vb=val[sortKey](b);return (va>vb?1:va<vb?-1:0)*sortDir;});
  $('boardHint').textContent=`${list.length} 人可選，點表頭排序`;
  const th=(k,l,cls='')=>`<th class="${cls}" data-sort="${k||''}">${l}${sortKey===k?(sortDir<0?' ▾':' ▴'):''}</th>`;
  $('board').querySelector('thead').innerHTML=`<tr>${th('n','球員')}<th>位置</th>${th('s','推薦分','r')}${th('b','價值','r')}${th('a','ADP','r')}${th('sv','撐到下一手','r')}${CATS.map(c=>`<th class="r">${c}</th>`).join('')}<th>備註</th><th></th></tr>`;
  $('board').querySelector('tbody').innerHTML=rows.slice(0,200).map(x=>{const p=x.p;return `<tr>
    <td><b>${esc(p.n)}</b> <span class="hint">${p.t}</span></td><td>${p.p.join('/')}</td>
    <td class="r num">${x.s.toFixed(1)}</td><td class="r num">${x.b.toFixed(1)}</td><td class="r num">${p.a}</td><td class="r num">${h.next?pct(x.sv):'-'}</td>
    ${p.z.map((z,k)=>`<td class="r num"><span class="z ${state.punt.includes(k)?'':zc(z)}">${fmt(z)}</span></td>`).join('')}
    <td class="hint">${esc(p.r||'')}</td><td><button type="button" data-pick="${p.id}">選走</button></td></tr>`;}).join('');
}

function renderSide(roster,w){
  const {assign}=matchCount(roster);
  const bySlot=SLOTS.map((s,i)=>assign[i]>=0?roster[assign[i]]:null);
  const used=new Set(assign.filter(x=>x>=0));
  const bench=roster.filter((p,i)=>!used.has(i));
  let html=SLOTS.map((s,i)=>`<div class="s">${s[0]}</div><div class="p ${bySlot[i]?'':'empty'}">${bySlot[i]?esc(bySlot[i].n):'空'}</div>`).join('');
  html+=bench.map(p=>`<div class="s">BN</div><div class="p">${esc(p.n)}</div>`).join('');
  $('slots').innerHTML=html;
  const n=Math.max(1,roster.length);
  $('bars').innerHTML=CATS.map((c,k)=>{
    const v=roster.reduce((s,p)=>s+p.z[k]*p.av,0)/n, pc=Math.max(-1.5,Math.min(1.5,v))/1.5*50;
    const color=state.punt.includes(k)?'var(--line)':v>=0?'var(--good)':'var(--bad)';
    const style=pc>=0?`left:50%;width:${pc}%`:`left:${50+pc}%;width:${-pc}%`;
    return `<div class="bar"><span>${c}</span><div class="track"><i style="${style};background:${color}"></i></div><span class="num">${roster.length?fmt(v):'-'}</span></div>`;
  }).join('');
  $('punts').innerHTML=CATS.map((c,k)=>`<label for="punt${k}"><input id="punt${k}" type="checkbox" data-punt="${k}" ${state.punt.includes(k)?'checked':''}>${c}</label>`).join('');
}

function renderLog(){
  $('log').innerHTML=state.picks.map((x,i)=>{const t=teamAt(i+1),me=t===state.slot;return `<div class="${me?'me':''} ${editIdx===i?'editing':''}"><span class="num">#${i+1}</span><span class="t">${me?'你':'第 '+t+' 隊'}</span><span>${esc(x.id!=null?byId.get(x.id).n:x.name)}</span><span class="acts"><button type="button" data-edit="${i}" aria-label="修改第 ${i+1} 手">改</button><button type="button" data-del="${i}" aria-label="刪除第 ${i+1} 手">刪</button></span></div>`;}).reverse().join('')||'<span class="hint">還沒有紀錄。每一手都要記，包括你自己選的。</span>';
}

// ---------- actions ----------
let editIdx=null;
function setEdit(i){
  editIdx=i;
  $('editBar').hidden=i==null;
  if(i!=null){const x=state.picks[i];$('editMsg').textContent=`修改第 ${i+1} 手（${teamAt(i+1)===state.slot?'你':'第 '+teamAt(i+1)+' 隊'}，目前是 ${x.id!=null?byId.get(x.id).n:x.name}）：輸入正確的球員後按 Enter。`;$('q').focus();}
  render();
}
function pick(id){
  if(editIdx!=null){
    const other=state.picks.findIndex((x,j)=>x.id===id&&j!==editIdx);
    if(other>=0){$('editMsg').textContent=`${byId.get(id).n} 已經記在第 ${other+1} 手，請先修改那一手。`;return;}
    state.picks[editIdx]={id};$('q').value='';hideSugg();setEdit(null);return;
  }
  if(cur()>total())return;if(taken().has(id))return;state.picks.push({id});$('q').value='';hideSugg();render();
}
function pickCustom(name){if(!name.trim())return;if(editIdx!=null){state.picks[editIdx]={id:null,name:name.trim()};$('q').value='';hideSugg();setEdit(null);return;}if(cur()>total())return;state.picks.push({id:null,name:name.trim()});$('q').value='';hideSugg();render();}

function matches(q,limit=6){
  const nq=norm(q);if(!nq)return [];
  const t=taken();if(editIdx!=null&&state.picks[editIdx].id!=null)t.delete(state.picks[editIdx].id);
  const sc=p=>{if(p.key===nq||p.alias.includes(nq))return 0;if(p.key.startsWith(nq)||p.alias.some(a=>a.startsWith(nq)))return 1;if(p.last.startsWith(nq))return 2;if(p.key.includes(nq))return 3;return 9;};
  return PLAYERS.map(p=>[sc(p)+(t.has(p.id)?.5:0),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].a-b[1].a).slice(0,limit).map(x=>x[1]);
}
let suggIdx=0,suggList=[];
function showSugg(){
  const t=taken();if(editIdx!=null&&state.picks[editIdx].id!=null)t.delete(state.picks[editIdx].id);
  suggList=matches($('q').value);
  const el=$('sugg');
  if(!$('q').value.trim()){el.hidden=true;return;}
  suggIdx=suggList.findIndex(p=>!t.has(p.id));
  el.innerHTML=suggList.map((p,i)=>t.has(p.id)
    ?`<div class="gone"><span>${esc(p.n)}</span><small>已記在第 ${state.picks.findIndex(x=>x.id===p.id)+1} 手</small></div>`
    :`<div class="${i===suggIdx?'on':''}" data-pick="${p.id}"><span>${esc(p.n)}</span><small>${p.p.join('/')} · ${p.t} · ADP ${p.a}</small></div>`).join('')+`<div data-custom="1"><span>記為名單外球員：「${esc($('q').value.trim())}」</span><small>名單裡沒有時才選，用方向鍵或點擊</small></div>`;
  suggList=suggList.filter(p=>!t.has(p.id));
  el.hidden=false;
}
function hideSugg(){$('sugg').hidden=true;}
$('q').addEventListener('input',showSugg);
$('q').addEventListener('keydown',e=>{
  const items=[...$('sugg').children];
  const live=items.map((d,i)=>d.classList.contains('gone')?-1:i).filter(i=>i>=0);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!live.length)return;let j=live.indexOf(suggIdx);j=j<0?0:(j+(e.key==='ArrowDown'?1:-1)+live.length)%live.length;suggIdx=live[j];items.forEach((d,i)=>d.classList.toggle('on',i===suggIdx));}
  else if(e.key==='Enter'){e.preventDefault();const it=items[suggIdx];if(!it)return;if(it.dataset.custom)pickCustom($('q').value);else pick(+it.dataset.pick);}
  else if(e.key==='Escape'){hideSugg();if(editIdx!=null)setEdit(null);}
});
$('addBtn').addEventListener('click',()=>{if(suggList[0])pick(suggList[0].id);});
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]');if(ed){setEdit(+ed.dataset.edit);return;}
  const dl=e.target.closest('[data-del]');if(dl){state.picks.splice(+dl.dataset.del,1);setEdit(null);return;}
  const b=e.target.closest('[data-pick]');if(b){pick(+b.dataset.pick);return;}
  if(e.target.closest('[data-custom]')){pickCustom($('q').value);return;}
  const s=e.target.closest('th[data-sort]');if(s&&s.dataset.sort){const k=s.dataset.sort;sortDir=sortKey===k?-sortDir:(k==='n'?1:-1);sortKey=k;render();return;}
  if(!e.target.closest('.entry'))hideSugg();
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.punt;if(k!=null){const i=+k;state.punt=e.target.checked?[...state.punt,i]:state.punt.filter(x=>x!==i);render();}});
$('undo').addEventListener('click',()=>{state.picks.pop();setEdit(null);});
$('editCancel').addEventListener('click',()=>{$('q').value='';hideSugg();setEdit(null);});
$('filterQ').addEventListener('input',render);
$('filterPos').addEventListener('change',render);
$('togglePaste').addEventListener('click',()=>{$('pastePanel').hidden=!$('pastePanel').hidden;if(!$('pastePanel').hidden)$('pasteBox').focus();});

function parsePaste(text){
  const t=norm(text),found=[],t0=taken();
  PLAYERS.forEach(p=>{
    if(t0.has(p.id))return;
    const keys=[p.key,...p.alias.filter(a=>a.length>=3)];
    if(lastCount[p.last]===1&&p.last.length>=4)keys.push(p.last);
    let best=-1;
    for(const k of keys){const re=new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![a-z])');const m=re.exec(t);if(m&&(best<0||m.index<best))best=m.index;}
    if(best>=0)found.push([best,p]);
  });
  return found.sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
$('pasteGo').addEventListener('click',()=>{
  const ps=parsePaste($('pasteBox').value);
  let n=0;for(const p of ps){if(cur()>total())break;state.picks.push({id:p.id});n++;}
  $('pasteMsg').textContent=n?`記錄了 ${n} 人：${ps.slice(0,n).map(p=>p.n).join('、')}`:'沒有找到名單裡的球員，請確認姓名。';
  if(n)$('pasteBox').value='';
  render();
});

// settings
function fillSettings(){$('setTeams').value=state.teams;$('setSlot').value=state.slot;$('setRounds').value=state.rounds;}
$('toggleSettings').addEventListener('click',()=>{$('settingsPanel').hidden=!$('settingsPanel').hidden;fillSettings();});
$('saveSettings').addEventListener('click',()=>{
  const t=Math.max(4,Math.min(20,+$('setTeams').value||12)),s=Math.max(1,Math.min(t,+$('setSlot').value||t)),r=Math.max(5,Math.min(25,+$('setRounds').value||13));
  Object.assign(state,{teams:t,slot:s,rounds:r});fillSettings();render();
});
function bindReset(){$('reset').addEventListener('click',()=>{
  $('resetArea').innerHTML='<span class="row"><span class="hint">清除全部選秀紀錄？</span><button id="resetYes" class="primary" type="button">確定清除</button><button id="resetNo" type="button">取消</button></span>';
  $('resetYes').addEventListener('click',()=>{state.picks=[];state.punt=[];restore();render();});
  $('resetNo').addEventListener('click',restore);
});}
function restore(){$('resetArea').innerHTML='<button id="reset" type="button">清除選秀紀錄</button>';bindReset();}
bindReset();
render();
</script>
