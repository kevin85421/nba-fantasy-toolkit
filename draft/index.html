<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9-Cat 選秀作戰室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: scoreboard strip on top, recommendation card, then board (left) + my roster (right) */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#18201c; --muted:#5e6a63; --line:#d9ddd6;
  --accent:#d4571c; --accent-ink:#ffffff; --accent-soft:#fbe7dc;
  --good:#1f7a4d; --good-soft:#dcefe3; --bad:#b3362c; --bad-soft:#f6dedb;
  --me:#1d4ed8; --me-soft:#dfe7fb; --chip:#eceee9;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1b211e; --ink:#e7ece8; --muted:#97a39c; --line:#2d3531;
  --accent:#f07a3f; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --good:#5fc893; --good-soft:#1c3328; --bad:#f08178; --bad-soft:#3b2220;
  --me:#7ea2ff; --me-soft:#1f2a47; --chip:#252c28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1b211e; --ink:#e7ece8; --muted:#97a39c; --line:#2d3531;
  --accent:#f07a3f; --accent-ink:#1a0f08; --accent-soft:#3a2418;
  --good:#5fc893; --good-soft:#1c3328; --bad:#f08178; --bad-soft:#3b2220;
  --me:#7ea2ff; --me-soft:#1f2a47; --chip:#252c28; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.03em;margin:0 0 8px;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
input,select{font-family:inherit;font-size:14px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.clock{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.clock .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:96px}
.clock .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.clock .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.clock .cell.onme{background:var(--me);border-color:var(--me)}
.clock .cell.onme .k,.clock .cell.onme .v{color:#fff}
.mypicks{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pk{font-family:var(--f-mono);font-size:12px;padding:3px 7px;border-radius:5px;background:var(--chip);color:var(--muted)}
.pk.done{text-decoration:line-through;opacity:.6}
.pk.next{background:var(--me);color:#fff}
.rec{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.rec .main{border-left:5px solid var(--accent)}
.rec .main.mine{border-left-color:var(--me)}
.recname{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05}
.recmeta{color:var(--muted);margin-top:2px}
.why{margin:10px 0 0;padding-left:18px}
.why li{margin:2px 0}
.alts{display:flex;flex-direction:column;gap:6px}
.alt{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--chip)}
.alt b{font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.controls input[type=search]{flex:1 1 200px;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-height:72vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--panel);font-size:11px;color:var(--muted);letter-spacing:.05em;z-index:1;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
td.name{font-weight:600}
td.name small{display:block;font-weight:400;color:var(--muted);font-size:11px}
td.z{font-family:var(--f-mono);font-size:12px}
.zp2{background:var(--good-soft);color:var(--good);font-weight:600}
.zp1{color:var(--good)}
.zn1{color:var(--bad)}
.zn2{background:var(--bad-soft);color:var(--bad);font-weight:600}
td.punted{opacity:.35}
tr.top1 td{background:var(--accent-soft)}
.surv{display:inline-block;min-width:44px;font-family:var(--f-mono);font-size:12px;padding:1px 5px;border-radius:4px}
.surv.lo{background:var(--bad-soft);color:var(--bad)}
.surv.mid{background:var(--chip)}
.surv.hi{background:var(--good-soft);color:var(--good)}
.inj{color:var(--bad);font-size:11px;cursor:help}
.pick{padding:4px 9px;font-weight:700}
.punts{display:flex;flex-wrap:wrap;gap:6px}
.punt{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:999px}
.punt.on{background:var(--ink);color:var(--bg);border-color:var(--ink);text-decoration:line-through}
.side{display:flex;flex-direction:column;gap:14px}
.slots{display:grid;grid-template-columns:52px 1fr;gap:3px 8px;font-size:13px}
.slots .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.slots .empty{color:var(--muted);font-style:italic}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:46px 1fr 44px;gap:6px;align-items:center;font-size:12px}
.bar .lab{font-family:var(--f-mono)}
.bar .track{position:relative;height:12px;background:var(--chip);border-radius:3px}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.bar .val{font-family:var(--f-mono);text-align:right}
.log{max-height:280px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log div{display:flex;gap:8px}
.log .n{font-family:var(--f-mono);color:var(--muted);width:40px}
.log .mine{color:var(--me);font-weight:700}
.hint{font-size:12px;color:var(--muted)}
.warn{background:var(--accent-soft);border-radius:7px;padding:8px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:6px;align-items:center}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}.rec{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1>9-Cat 選秀作戰室</h1>
      <div class="sub">12 隊蛇形 · 你是第 12 順位 · 13 輪 · PTS REB AST ST BLK 3PTM FG% FT% TO</div>
    </div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="mypicks" id="mypicks"></div>

  <div class="rec">
    <div class="panel main" id="recMain"></div>
    <div class="panel">
      <h2>其他選擇</h2>
      <div class="alts" id="recAlts"></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="controls">
        <input type="search" id="q" placeholder="搜尋球員 / 球隊（例如 Jokic、LAL）" autocomplete="off">
        <select id="posf" aria-label="位置篩選">
          <option value="">全部位置</option><option>PG</option><option>SG</option><option>SF</option><option>PF</option><option>C</option>
        </select>
        <button id="undo">↶ 復原上一手</button>
      </div>
      <div class="controls">
        <span class="hint">Punt（放棄的類別不計分）：</span>
        <div class="punts" id="punts"></div>
        <label class="hint"><input type="checkbox" id="availToggle" checked> 計入缺賽風險</label>
      </div>
      <div class="tablewrap"><table id="board"><thead></thead><tbody></tbody></table></div>
      <p class="hint">按「選走」會把球員分給目前輪到的隊伍（輪到你就進你的陣容）。z 值以前 156 名球員為基準，FG%/FT% 依出手數加權。「到你時還在」是依 ADP 估算下次輪到你時這位球員還沒被選走的機率。</p>
      <div class="row">
        <input id="customName" placeholder="名單裡沒有的球員" style="flex:1 1 160px;min-width:0">
        <button id="customAdd">把這位球員記為被選走</button>
      </div>
    </div>

    <div class="side">
      <div class="panel">
        <h2>你的類別強弱</h2>
        <div class="bars" id="bars"></div>
        <div id="puntHint" style="margin-top:8px"></div>
      </div>
      <div class="panel">
        <h2>你的陣容</h2>
        <div class="slots" id="slots"></div>
      </div>
      <div class="panel">
        <h2>選秀紀錄</h2>
        <div class="log" id="log"></div>
        <div class="row" style="margin-top:10px">
          <span id="resetArea"><button id="reset">重新開始</button></span>
        </div>
      </div>
    </div>
  </div>
</div>

const CATS=[
  {k:'pts',l:'PTS'},{k:'reb',l:'REB'},{k:'ast',l:'AST'},{k:'stl',l:'ST'},{k:'blk',l:'BLK'},
  {k:'tpm',l:'3PTM'},{k:'fg',l:'FG%'},{k:'ft',l:'FT%'},{k:'to',l:'TO'}];
const TEAMS=12, ROUNDS=13, ME=12, TOTAL=TEAMS*ROUNDS;
const SLOTS=[['PG',['PG']],['SG',['SG']],['G',['PG','SG']],['SF',['SF']],['PF',['PF']],['F',['SF','PF']],['C',['C']],['C',['C']],['Util',null],['Util',null]];

const players = RAW.trim().split('\n').map((line,i)=>{
  const f=line.split('|'); const n=x=>parseFloat(x);
  return {id:i, adp:i+1, name:f[0], team:f[1], pos:f[2].split(','), g:n(f[3]),
    pts:n(f[4]),reb:n(f[5]),ast:n(f[6]),stl:n(f[7]),blk:n(f[8]),tpm:n(f[9]),
    fgp:n(f[10]),fga:n(f[11]),ftp:n(f[12]),fta:n(f[13]),to:n(f[14]),note:f[15]||'', z:{}, zt:0};
});
const byId = new Map(players.map(p=>[p.id,p]));

function computeZ(){
  let pool = players.slice(0,156);
  for(let pass=0;pass<2;pass++){
    const lgFg = pool.reduce((s,p)=>s+p.fgp*p.fga,0)/pool.reduce((s,p)=>s+p.fga,0);
    const lgFt = pool.reduce((s,p)=>s+p.ftp*p.fta,0)/pool.reduce((s,p)=>s+p.fta,0);
    const raw = p=>({pts:p.pts,reb:p.reb,ast:p.ast,stl:p.stl,blk:p.blk,tpm:p.tpm,
      fg:(p.fgp-lgFg)*p.fga, ft:(p.ftp-lgFt)*p.fta, to:p.to});
    const stats={};
    for(const c of CATS){
      const vals=pool.map(p=>raw(p)[c.k]);
      const m=vals.reduce((a,b)=>a+b,0)/vals.length;
      const sd=Math.sqrt(vals.reduce((a,b)=>a+(b-m)**2,0)/vals.length)||1;
      stats[c.k]={m,sd};
    }
    for(const p of players){
      const r=raw(p); p.zt=0;
      for(const c of CATS){
        let z=(r[c.k]-stats[c.k].m)/stats[c.k].sd; if(c.k==='to') z=-z;
        p.z[c.k]=z; p.zt+=z;
      }
    }
    pool=[...players].sort((a,b)=>b.zt-a.zt).slice(0,156);
  }
}
computeZ();

const STORE='draft-war-room-v1';
let state={picks:[],custom:[],punt:[],avail:true};
try{const s=JSON.parse(localStorage.getItem(STORE)); if(s&&Array.isArray(s.picks)) state=Object.assign(state,s);}catch(e){}

const teamAt = pick=>{const r=Math.ceil(pick/TEAMS), i=(pick-1)%TEAMS+1; return r%2? i : TEAMS+1-i;};
const MY_PICKS=[]; for(let p=1;p<=TOTAL;p++) if(teamAt(p)===ME) MY_PICKS.push(p);
const curPick=()=>state.picks.length+1;
const takenIds=()=>new Set(state.picks.filter(x=>x.id!=null).map(x=>x.id));
const myPlayers=()=>state.picks.filter(x=>x.team===ME&&x.id!=null).map(x=>byId.get(x.id));
const available=()=>{const t=takenIds(); return players.filter(p=>!t.has(p.id));};

// ---------- roster fit ----------
function matchCount(list){
  const assign=new Array(SLOTS.length).fill(-1);
  const ok=(p,s)=>!SLOTS[s][1]||p.pos.some(x=>SLOTS[s][1].includes(x));
  function tryP(i,seen){
    for(let s=0;s<SLOTS.length;s++){
      if(!ok(list[i],s)||seen[s]) continue; seen[s]=true;
      if(assign[s]<0||tryP(assign[s],seen)){assign[s]=i;return true;}
    }
    return false;
  }
  // specific slots first so Util is used last
  let n=0; for(let i=0;i<list.length;i++) if(tryP(i,[])) n++;
  return {n,assign};
}

// ---------- scoring ----------
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function availF(p){return state.avail? clamp(p.g/72,0.55,1):1;}
function teamProfile(){
  const mine=myPlayers(); const prof={};
  for(const c of CATS) prof[c.k]=mine.reduce((s,p)=>s+p.z[c.k]*availF(p),0);
  return {prof,n:mine.length};
}
function weights(){
  const {prof,n}=teamProfile(); const w={};
  for(const c of CATS){
    if(state.punt.includes(c.k)){w[c.k]=0;continue;}
    let need=0; if(n>=2){need=clamp(-(prof[c.k]/n)*0.3,-0.2,0.35);}
    w[c.k]=1+need;
  }
  return w;
}
function score(p,w,baseMatch){
  let s=0; for(const c of CATS) s+=w[c.k]*p.z[c.k];
  s*=availF(p);
  const mine=myPlayers();
  const myRound=mine.length+1;
  if(myRound>=5 && baseMatch!=null){
    const m=matchCount([...mine,p]).n;
    if(m>baseMatch) s+= myRound>=9?0.6:0.25;
  }
  return s;
}
const Phi=x=>{const t=1/(1+0.2316419*Math.abs(x));const d=0.3989423*Math.exp(-x*x/2);
  const pr=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-pr:pr;};
function survivalMap(avail){
  // picks other teams make before my next turn
  const cp=curPick(); const onMe=teamAt(cp)===ME;
  const nextMine=MY_PICKS.find(p=>onMe? p>cp : p>=cp);
  let k = nextMine? (onMe? nextMine-cp-1 : nextMine-cp) : 0;
  const sorted=[...avail].sort((a,b)=>a.adp-b.adp); const m=new Map();
  sorted.forEach((p,i)=>{const r=i+1; if(!nextMine){m.set(p.id,null);return;}
    const sd=Math.max(2.5,r*0.22); m.set(p.id, 1-Phi((k+0.5-r)/sd));});
  return {m,k,nextMine};
}

const zc=z=>z>=1?'zp2':z>=0.35?'zp1':z<=-1?'zn2':z<=-0.35?'zn1':'';

    <div class="cell ${onMe?'onme':''}"><div class="k">輪到</div><div class="v">${onMe?'你！':'第 '+onTeam+' 隊'}</div></div>
    <div class="cell"><div class="k">距離你</div><div class="v">${onMe?'現在':(nextMine? (nextMine-cp)+' 手':'—')}</div></div>`;
  $('mypicks').innerHTML='<span class="hint">你的順位：</span>'+MY_PICKS.map(p=>`<span class="pk ${p<cp?'done':''} ${p===nextMine?'next':''}">#${p}</span>`).join('');

  const avail=available(); const w=weights(); const baseMatch=matchCount(mine).n;
  const {m:surv,k,nextMine:nm}=survivalMap(avail);
  avail.forEach(p=>{p._s=score(p,w,baseMatch); p._v=surv.get(p.id);});
  const ranked=[...avail].sort((a,b)=>b._s-a._s);

  // recommendation: among near-best values, take the one least likely to come back
  let rec=ranked[0];
  if(ranked.length){
    const best=ranked[0]._s;
    const close=ranked.slice(0,6).filter(p=>p._s>=best-0.8);
    if(close.length>1 && nm){ rec=close.reduce((a,b)=>((a._v??1)<=(b._v??1)?a:b)); }
  }
  renderRec(rec,ranked,onMe,done,k,nm,w);
  renderBoard(avail,rec,w);
  renderSide(mine,w);
}

function catStrengths(p){
  const arr=CATS.map(c=>({l:c.l,k:c.k,z:p.z[c.k]})).sort((a,b)=>b.z-a.z);
  return {good:arr.filter(x=>x.z>=0.8&&!state.punt.includes(x.k)).slice(0,4).map(x=>x.l),
          bad:arr.filter(x=>x.z<=-0.8&&!state.punt.includes(x.k)).map(x=>x.l)};
}
function renderRec(rec,ranked,onMe,done,k,nm,w){
  const el=$('recMain'); el.classList.toggle('mine',onMe);
  if(done||!rec){el.innerHTML='<h2>選秀結束</h2><p>祝你這季拿冠軍。</p>';$('recAlts').innerHTML='';return;}
  const s=catStrengths(rec); const why=[];
  why.push(`9-Cat 總 z 值 ${fmt(rec.zt,2)}（未加權），調整後分數 ${fmt(rec._s,2)}`);
  if(s.good.length) why.push(`強項：${s.good.join('、')}`);
  if(s.bad.length) why.push(`弱項：${s.bad.join('、')}`);
  const needs=CATS.filter(c=>w[c.k]>1.12).map(c=>c.l);
  if(needs.length) why.push(`你目前缺：${needs.join('、')}（已加權）`);
  if(rec._v!=null) why.push(`下次輪到你（#${nm}）時還在的機率約 ${Math.round(rec._v*100)}%`);
  if(rec.note) why.push(`注意：${rec.note}`);
  el.innerHTML=`<h2>${onMe?'現在就選':'輪到你時的首選'}</h2>
    <div class="recname">${esc(rec.name)}</div>
    <div class="recmeta">${rec.team} · ${rec.pos.join('/')} · ADP ${rec.adp} · 預估 ${rec.g} 場</div>
    <ul class="why">${why.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="row" style="margin-top:10px"><button class="primary pick" data-pick="${rec.id}">${onMe?'選他進我的陣容':'記為第 '+teamAt(curPick())+' 隊選走'}</button></div>`;
  const alts=ranked.filter(p=>p!==rec).slice(0,6);
  $('recAlts').innerHTML=alts.map(p=>`<div class="alt"><div><b>${esc(p.name)}</b> <span class="hint">${p.pos.join('/')} · ADP ${p.adp}</span></div>
     <div class="row"><span class="surv ${sv(p._v)}" title="到你時還在的機率">${p._v==null?'—':Math.round(p._v*100)+'%'}</span><span class="hint">${fmt(p._s,1)}</span>
     <button data-pick="${p.id}">選走</button></div></div>`).join('')
     + `<p class="hint">百分比 = 下次輪到你時這位還在的機率。分數接近時，系統會先推薦比較不可能撐到下一輪的球員。</p>`;
}
const sv=v=>v==null?'mid':v<0.35?'lo':v<0.7?'mid':'hi';

function renderBoard(avail,rec,w){
  const q=$('q').value.trim().toLowerCase(), pf=$('posf').value;
  let rows=avail.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase()===q)&&(!pf||p.pos.includes(pf)));
  const key={score:p=>p._s,adp:p=>-p.adp,zt:p=>p.zt,surv:p=>p._v??0};
  rows.sort((a,b)=>{
    if(key[sortKey]) return sortDir*(key[sortKey](a)-key[sortKey](b));
    return sortDir*(a.z[sortKey]-b.z[sortKey]);
  });
  rows=rows.slice(0,120);
  const head=`<tr><th class="l" data-s="adp">ADP</th><th class="l">球員</th>${CATS.map(c=>`<th data-s="${c.k}">${c.l}</th>`).join('')}
    <th data-s="zt">總z</th><th data-s="score">推薦分</th><th data-s="surv">到你時還在</th><th></th></tr>`;
  $('board').tHead.innerHTML=head;
  $('board').tBodies[0].innerHTML=rows.map(p=>`<tr class="${p===rec?'top1':''}">
    <td class="l">${p.adp}</td>
    <td class="l name">${esc(p.name)}${p.note?` <span class="inj" title="${esc(p.note)}">⚠</span>`:''}<small>${p.team} · ${p.pos.join('/')} · ${p.g}場</small></td>
    ${CATS.map(c=>`<td class="z ${zc(p.z[c.k])} ${state.punt.includes(c.k)?'punted':''}" title="${statText(p,c.k)}">${p.z[c.k].toFixed(1)}</td>`).join('')}
    <td class="z">${p.zt.toFixed(1)}</td><td class="z"><b>${p._s.toFixed(2)}</b></td>
    <td><span class="surv ${sv(p._v)}">${p._v==null?'—':Math.round(p._v*100)+'%'}</span></td>
    <td><button class="pick" data-pick="${p.id}">選走</button></td></tr>`).join('');
}
function statText(p,k){
  return {pts:p.pts+' 分',reb:p.reb+' 籃板',ast:p.ast+' 助攻',stl:p.stl+' 抄截',blk:p.blk+' 火鍋',tpm:p.tpm+' 三分',
    fg:(p.fgp*100).toFixed(1)+'% / '+p.fga+' 次出手',ft:(p.ftp*100).toFixed(1)+'% / '+p.fta+' 次罰球',to:p.to+' 失誤'}[k];
}

function renderSide(mine,w){
  const {prof,n}=teamProfile();
  const max=Math.max(3,...CATS.map(c=>Math.abs(prof[c.k])));
  $('bars').innerHTML = n? CATS.map(c=>{
    const v=prof[c.k], pct=Math.abs(v)/max*50, punt=state.punt.includes(c.k);
    return `<div class="bar" style="${punt?'opacity:.4':''}"><span class="lab">${c.l}</span><span class="track"><span class="mid"></span>
      <span class="fill" style="${v>=0?`left:50%;width:${pct}%;background:var(--good)`:`right:50%;width:${pct}%;background:var(--bad)`}"></span></span>
      <span class="val">${fmt(v,1)}</span></div>`;}).join('')
    : '<p class="hint">選了第一位球員後，這裡會顯示你 9 個類別的 z 值總和。右邊綠色是優勢，左邊紅色是弱勢。</p>';
  // punt suggestion
  let hint='';
  if(n>=3){
    const weak=CATS.filter(c=>!state.punt.includes(c.k)&&prof[c.k]/n<-0.6).map(c=>c.l);
    if(weak.length) hint=`<div class="warn">你的 ${weak.join('、')} 已明顯落後。9-Cat 對戰只需要贏 5 項，可以考慮 punt 這些類別，把資源集中在其他項目（點上方的類別按鈕即可切換）。</div>`;
  }
  $('puntHint').innerHTML=hint;
  // slots
  const {assign}=matchCount(mine); const used=new Set(assign.filter(i=>i>=0));
  const rows=SLOTS.map((s,si)=>{const i=assign[si]; return `<span class="s">${s[0]}</span>${i>=0?`<span>${esc(mine[i].name)}</span>`:'<span class="empty">空</span>'}`;});
  const bench=mine.filter((_,i)=>!used.has(i));
  for(let b=0;b<3;b++) rows.push(`<span class="s">BN</span>${bench[b]?`<span>${esc(bench[b].name)}</span>`:'<span class="empty">空</span>'}`);
  bench.slice(3).forEach(p=>rows.push(`<span class="s">+</span><span>${esc(p.name)}</span>`));
  $('slots').innerHTML=rows.join('');
  // log
  $('log').innerHTML=state.picks.map((x,i)=>{
    const p=x.id!=null?byId.get(x.id):null; const nm=p?p.name:x.name;
    return `<div><span class="n">#${i+1}</span><span class="${x.team===ME?'mine':''}">${x.team===ME?'你':'第'+x.team+'隊'}</span><span>${esc(nm)}</span></div>`;
  }).reverse().join('') || '<p class="hint">還沒有人被選走。</p>';
  // punts
  $('punts').innerHTML=CATS.map(c=>`<button class="punt ${state.punt.includes(c.k)?'on':''}" data-punt="${c.k}">${c.l}</button>`).join('');
  $('availToggle').checked=state.avail;
}

function pick(id){
  const cp=curPick(); if(cp>TOTAL) return;
  if(takenIds().has(id)) return;
  state.picks.push({id,team:teamAt(cp)}); save(); render();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pick]'); if(b){pick(+b.dataset.pick);return;}
  const pu=e.target.closest('[data-punt]'); if(pu){const k=pu.dataset.punt;
    state.punt=state.punt.includes(k)?state.punt.filter(x=>x!==k):[...state.punt,k]; save(); render(); return;}
  const th=e.target.closest('th[data-s]'); if(th){const s=th.dataset.s; if(sortKey===s) sortDir*=-1; else {sortKey=s; sortDir=-1;} render();}
});
$('undo').onclick=()=>{state.picks.pop(); save(); render();};
$('q').oninput=render; $('posf').onchange=render;
$('availToggle').onchange=e=>{state.avail=e.target.checked; save(); render();};
$('customAdd').onclick=()=>{const n=$('customName').value.trim(); if(!n||curPick()>TOTAL) return;
  state.picks.push({id:null,name:n,team:teamAt(curPick())}); $('customName').value=''; save(); render();};
function bindReset(){
  $('reset').onclick=()=>{
    $('resetArea').innerHTML='<span class="confirm"><span class="hint">清除全部選秀紀錄？</span><button id="resetYes" class="primary">確定清除</button><button id="resetNo">取消</button></span>';
    $('resetYes').onclick=()=>{state.picks=[];save();restoreReset();render();};
    $('resetNo').onclick=restoreReset;
  };
}
function restoreReset(){$('resetArea').innerHTML='<button id="reset">重新開始</button>';bindReset();}
bindReset();
render();
</script>
</body>
</html>
